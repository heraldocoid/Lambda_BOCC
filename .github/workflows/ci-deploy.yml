name: CI Build & Package (Deploy optional)

on:
  push:
    branches: [ feat/Miguel_Suarez ]
  workflow_dispatch: {}

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Package (create ZIP)
        run: npm run package
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-zip
          path: deployment.zip

  deploy:
    needs: build-test-package
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/feat/Miguel_Suarez'
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-zip
          path: .
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Deploy to Lambda
        env:
          LAMBDA_FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
        run: |
          if [ -z "$LAMBDA_FUNCTION_NAME" ]; then
            echo "LAMBDA_FUNCTION_NAME not set, skipping deploy";
            exit 0;
          fi
          aws lambda update-function-code --function-name "$LAMBDA_FUNCTION_NAME" --zip-file fileb://deployment.zip
